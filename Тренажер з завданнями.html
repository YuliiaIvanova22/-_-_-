<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Курс на вступ — тренажер</title>
<style>
:root{--violet:#653cff;--blue:#15224f;--soft:#f6f5ff;--line:#e7e5f4;--green:#198754;--red:#d9364f}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f7f6ff,#fff 260px);color:#17203f}
.wrap{max-width:1120px;margin:auto;padding:24px} .hero{width:100%;border-radius:18px;box-shadow:0 8px 30px #3f2ca01a;display:block}
.intro{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:22px 0} h1{font-size:28px;margin:0} .sub{color:#69708c;margin-top:6px} .progress{min-width:210px;background:white;border:1px solid var(--line);padding:12px 14px;border-radius:14px} .bar{height:8px;background:#eceafa;border-radius:9px;overflow:hidden;margin-top:8px} .fill{height:100%;width:0;background:linear-gradient(90deg,#6d40ff,#5978ff)}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:#f9f8ffdd;backdrop-filter:blur(10px);z-index:5} .tab{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;font-weight:650;cursor:pointer} .tab.active{background:var(--blue);color:white;border-color:var(--blue)}
.section{display:none} .section.active{display:block} .section-head{display:flex;align-items:center;gap:12px;margin:18px 0} .badge{background:#ece8ff;color:var(--violet);font-weight:800;border-radius:12px;padding:8px 10px} h2{margin:0;font-size:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px} .card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 24px #29206a0a} .qnum{font-size:12px;color:#8a90a8;font-weight:800;text-transform:uppercase;letter-spacing:.08em} .prompt{font-size:18px;font-weight:700;margin:9px 0 15px;line-height:1.4} .math{font-family:Georgia,'Times New Roman',serif;font-size:28px;text-align:center;margin:12px 0 18px} .frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.05;margin:0 4px} .frac .top{border-bottom:2px solid currentColor;padding:0 5px 2px} .frac .bot{padding:2px 5px 0}
.answer-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap} input.ans{width:150px;padding:11px 12px;border:1.5px solid #cfd2e3;border-radius:11px;font-size:17px} input.small{width:78px;text-align:center;padding:8px 10px}.frac-input{display:inline-flex;flex-direction:column;align-items:stretch;width:86px;vertical-align:middle}.frac-input input{width:100%!important;border-radius:9px}.frac-input .frac-line{height:2px;background:#17203f;margin:4px 3px}.slash{display:none} button.check{border:0;background:var(--violet);color:white;padding:11px 16px;border-radius:11px;font-weight:750;cursor:pointer} button.check:hover{filter:brightness(.95)} .feedback{min-height:24px;margin-top:10px;font-weight:650} .ok{color:var(--green)} .bad{color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px} .opt{border:1.5px solid #d9dbea;border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff} .opt:has(input:checked){border-color:var(--violet);background:#f1eeff} .opt input{margin-right:8px}
.diagram{display:flex;justify-content:center;background:#fbfbff;border:1px solid #efedf8;border-radius:14px;padding:8px;margin:8px 0 14px} svg{max-width:100%;height:auto} .nav{display:flex;justify-content:space-between;margin:22px 0} .nav button{border:1px solid var(--line);background:white;padding:11px 16px;border-radius:12px;font-weight:700;cursor:pointer}
.subtopic{margin:26px 0 12px;padding:14px 16px;border-radius:15px;background:#f4f1ff;border:1px solid #e3ddff;display:flex;align-items:center;justify-content:space-between;gap:10px}.subtopic h3{margin:0;font-size:19px;color:#202b55}.subcount{font-size:13px;font-weight:800;color:#653cff;background:white;border-radius:999px;padding:6px 9px}.note{background:#f1efff;border-left:4px solid var(--violet);padding:12px 14px;border-radius:10px;margin-bottom:18px;color:#4e5572}
@media(max-width:760px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.intro{align-items:flex-start;flex-direction:column}.progress{width:100%}.hero{border-radius:12px}}

],"options":["35 см²","70 см²","19 см²","80 см²"]},{"sec":"triangles","sub":"Площа трикутника","type":"tri_choice","prompt":"Основа трикутника дорівнює 8 см, а висота — 9 см. Знайдіть площу трикутника.","answer":36,"diagram":"area","values":[8,9],"options":["36 см²","72 см²","17 см²","82 см²"]},{"sec":"triangles","sub":"Площа трикутника","type":"tri_choice","prompt":"Основа трикутника дорівнює 16 см, а висота — 4 см. Знайдіть площу трикутника.","answer":32,"diagram":"area","values":[16,4],"options":["32 см²","64 см²","20 см²","74 см²"]},{"sec":"triangles","sub":"Площа трикутника","type":"tri_choice","prompt":"Основа трикутника дорівнює 18 см, а висота — 7 см. Знайдіть площу трикутника.","answer":63,"diagram":"area","values":[18,7],"options":["63 см²","126 см²","25 см²","136 см²"]}];
let solved=new Set();
function frac(n,d){return `<span class="frac"><span class="top">${n}</span><span class="bot">${d}</span></span>`}
function angleSvg(deg,kind){
 const cx=180, cy=132, L=120;
 const pt=(ang)=>[cx+L*Math.cos(ang*Math.PI/180),cy-L*Math.sin(ang*Math.PI/180)];
 const arc=(a1,a2,r=42)=>{const p1=[cx+r*Math.cos(a1*Math.PI/180),cy-r*Math.sin(a1*Math.PI/180)],p2=[cx+r*Math.cos(a2*Math.PI/180),cy-r*Math.sin(a2*Math.PI/180)];const large=Math.abs(a2-a1)>180?1:0;return `M ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A ${r} ${r} 0 ${large} 0 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`};
 if(kind==='vertical'){
   // Make the TOP vertical angle equal to deg. The two intersecting lines are symmetric about the vertical axis.
   const leftAng=90+deg/2, rightAng=90-deg/2;
   const pL=pt(leftAng), pR=pt(rightAng), pL2=pt(leftAng+180), pR2=pt(rightAng+180);
   return `<svg viewBox="0 0 360 220" width="360" aria-label="Вертикальні кути, один кут ${deg} градусів"><line x1="${pL[0]}" y1="${pL[1]}" x2="${pL2[0]}" y2="${pL2[1]}" stroke="#17203f" stroke-width="4"/><line x1="${pR[0]}" y1="${pR[1]}" x2="${pR2[0]}" y2="${pR2[1]}" stroke="#17203f" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="5" fill="#653cff"/><text x="188" y="126" font-size="18">O</text><path d="${arc(rightAng,leftAng,44)}" fill="none" stroke="#653cff" stroke-width="3"/><text x="164" y="${Math.max(24,cy-58)}" font-size="17">${deg}°</text></svg>`;
 }
 if(kind==='adjacent'){
   const rayAng=deg; const p=pt(rayAng);
   return `<svg viewBox="0 0 380 210" width="380" aria-label="Суміжні кути, один кут ${deg} градусів"><line x1="30" y1="${cy}" x2="350" y2="${cy}" stroke="#17203f" stroke-width="4"/><line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#17203f" stroke-width="4"/><path d="${arc(0,deg,42)}" fill="none" stroke="#653cff" stroke-width="3"/><text x="${cx+48*Math.cos(deg*Math.PI/360)}" y="${cy-48*Math.sin(deg*Math.PI/360)-7}" font-size="17">${deg}°</text><text x="172" y="158" font-size="17">B</text></svg>`;
 }
 const p=pt(deg);
 if(deg===90){
   return `<svg viewBox="0 0 360 210" width="360" aria-label="Прямий кут 90 градусів"><line x1="${cx}" y1="${cy}" x2="320" y2="${cy}" stroke="#17203f" stroke-width="4"/><line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#17203f" stroke-width="4"/><polyline points="${cx},${cy-34} ${cx+34},${cy-34} ${cx+34},${cy}" fill="none" stroke="#653cff" stroke-width="3"/><text x="${cx+45}" y="${cy-48}" font-size="17">90°</text><text x="170" y="158" font-size="17">B</text></svg>`;
 }
 return `<svg viewBox="0 0 360 210" width="360" aria-label="Кут ${deg} градусів"><line x1="${cx}" y1="${cy}" x2="320" y2="${cy}" stroke="#17203f" stroke-width="4"/><line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#17203f" stroke-width="4"/><path d="${arc(0,deg,42)}" fill="none" stroke="#653cff" stroke-width="3"/><text x="${cx+57*Math.cos(deg*Math.PI/360)-10}" y="${cy-57*Math.sin(deg*Math.PI/360)-6}" font-size="17">${deg}°</text><text x="170" y="158" font-size="17">B</text></svg>`;
}
function triSvg(kind,v){
 if(kind==='area'){let [b,h]=v; return `<svg viewBox="0 0 380 230" width="380" aria-label="Трикутник з основою ${b} см і висотою ${h} см"><polygon points="55,190 325,190 205,35" fill="#f5f2ff" stroke="#17203f" stroke-width="4"/><line x1="205" y1="35" x2="205" y2="190" stroke="#653cff" stroke-width="3"/><path d="M205 178 h12 v12" fill="none" stroke="#653cff" stroke-width="3"/><text x="150" y="216" font-size="17">основа ${b} см</text><text x="214" y="110" font-size="17">${h} см</text></svg>`}
 if(kind==='angles'){
   let [A,B,C]=v;
   // Construct a triangle whose base angles are A and B; C is the top angle.
   const x1=60,y1=190,x2=320,y2=190, base=x2-x1;
   const ar=A*Math.PI/180, br=B*Math.PI/180;
   const t=base*Math.sin(br)/(Math.sin(ar+br));
   const tx=x1+t*Math.cos(ar), ty=y1-t*Math.sin(ar);
   return `<svg viewBox="0 0 380 230" width="380" aria-label="Трикутник з кутами ${A}, ${B} і ${C} градусів"><polygon points="${x1},${y1} ${x2},${y2} ${tx.toFixed(1)},${ty.toFixed(1)}" fill="#f8f7ff" stroke="#17203f" stroke-width="4"/><text x="${x1+16}" y="${y1-10}" font-size="17">${A}°</text><text x="${x2-55}" y="${y2-10}" font-size="17">${B}°</text><text x="${tx-18}" y="${Math.max(22,ty+30)}" font-size="17">${C}°</text></svg>`;
 }
 let [a,b,c]=v;
 // Side labels: left=a, right=b, base=c. Build the triangle from the actual side lengths.
 const scale=Math.min(230/c,150/Math.max(a,b,c));
 const C=c*scale, A=a*scale, B=b*scale;
 const x1=(380-C)/2, x2=x1+C, y=190;
 const x=(A*A + C*C - B*B)/(2*C), h=Math.sqrt(Math.max(0,A*A-x*x));
 const tx=x1+x, ty=y-h;
 return `<svg viewBox="0 0 380 230" width="380" aria-label="Трикутник зі сторонами ${a}, ${b} і ${c} см"><polygon points="${x1.toFixed(1)},${y} ${x2.toFixed(1)},${y} ${tx.toFixed(1)},${ty.toFixed(1)}" fill="#f8f7ff" stroke="#17203f" stroke-width="4"/><text x="${((x1+tx)/2-38).toFixed(1)}" y="${((y+ty)/2).toFixed(1)}" font-size="17">${a} см</text><text x="${((x2+tx)/2+8).toFixed(1)}" y="${((y+ty)/2).toFixed(1)}" font-size="17">${b} см</text><text x="${((x1+x2)/2-22).toFixed(1)}" y="216" font-size="17">${c} см</text></svg>`;
}
function mathFor(q){
 if(q.type==='frac_reduce') return `${frac(q.n,q.d)} =`;
 if(q.type==='frac_expr') return q.expr.map((e,i)=>`${frac(e[0],e[1])}${e[2]?' '+e[2]+' ':''}`).join('')+' =';
 if(q.type==='frac_mul') return `${frac(q.a[0],q.a[1])} ${q.op} ${frac(q.b[0],q.b[1])} =`;
 return '';
}
function card(q,idx,local){let ans='';
 if(q.type.startsWith('frac_')) ans=`<div class="answer-row"><span class="frac-input" aria-label="Введіть дріб"><input class="ans small" inputmode="numeric" id="n${idx}" aria-label="чисельник"><span class="frac-line"></span><input class="ans small" inputmode="numeric" id="d${idx}" aria-label="знаменник"></span><button class="check" onclick="check(${idx})">Перевірити</button></div>`;
 else if(['choice','geo_choice','tri_choice'].includes(q.type)) ans=`<div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="q${idx}" value="${o}">${o}</label>`).join('')}</div><button class="check" onclick="check(${idx})">Перевірити</button>`;
 else ans=`<div class="answer-row"><input class="ans" id="a${idx}" inputmode="decimal" placeholder="Ваша відповідь"><button class="check" onclick="check(${idx})">Перевірити</button></div>`;
 let visual=''; if(q.type==='geo_choice') visual=`<div class="diagram">${angleSvg(q.degree,q.diagram)}</div>`; if(q.type==='tri_choice') visual=`<div class="diagram">${triSvg(q.diagram,q.values)}</div>`;
 return `<article class="card"><div class="qnum">Завдання ${local}</div><div class="prompt">${q.prompt}</div>${mathFor(q)?`<div class="math">${mathFor(q)}</div>`:''}${visual}${ans}<div class="feedback" id="f${idx}"></div></article>`}
function render(){
 let tabs=document.getElementById('tabs'),main=document.getElementById('main');
 sections.forEach((s,si)=>{
   tabs.innerHTML+=`<button class="tab ${si===0?'active':''}" onclick="show('${s[0]}',this)">${s[2]}. ${s[1]}</button>`;
   let arr=questions.map((q,i)=>[q,i]).filter(x=>x[0].sec===s[0]);
   let subs=[...new Set(arr.map(x=>x[0].sub))];
   let body=subs.map(sub=>{
      let items=arr.filter(x=>x[0].sub===sub);
      return `<div class="subtopic"><h3>${sub}</h3><span class="subcount">${items.length} завдань</span></div><div class="grid">${items.map((x,k)=>card(x[0],x[1],k+1)).join('')}</div>`;
   }).join('');
   main.innerHTML+=`<section class="section ${si===0?'active':''}" id="sec-${s[0]}"><div class="section-head"><span class="badge">${s[2]}</span><h2>${s[1]}</h2></div><div class="note">Обирайте потрібну підтему та тренуйте її окремо. У кожній підтемі — 6 завдань із миттєвою перевіркою.</div>${body}<div class="nav"><button onclick="prevSec('${s[0]}')">← Попередня тема</button><button onclick="nextSec('${s[0]}')">Наступна тема →</button></div></section>`;
 })
}
function show(id,el){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById('sec-'+id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); if(el) el.classList.add('active'); window.scrollTo({top:190,behavior:'smooth'})}
function prevSec(id){let i=sections.findIndex(s=>s[0]===id); if(i>0){let t=[...document.querySelectorAll('.tab')][i-1];show(sections[i-1][0],t)}}
function nextSec(id){let i=sections.findIndex(s=>s[0]===id); if(i<sections.length-1){let t=[...document.querySelectorAll('.tab')][i+1];show(sections[i+1][0],t)}}
function norm(v){return String(v).trim().replace(',','.').replace('−','-')}
function check(i){let q=questions[i], ok=false, f=document.getElementById('f'+i);
 if(q.type.startsWith('frac_')){let n=parseInt(document.getElementById('n'+i).value),d=parseInt(document.getElementById('d'+i).value); if(d){let g=(a,b)=>b?g(b,a%b):Math.abs(a);let gg=g(n,d);n/=gg;d/=gg;if(d<0){n=-n;d=-d} ok=n===q.answer[0]&&d===q.answer[1]}}
 else if(['choice','geo_choice','tri_choice'].includes(q.type)){let r=document.querySelector(`input[name=q${i}]:checked`);if(r){if(typeof q.answer==='number'){let m=norm(r.value).match(/-?\d+(?:\.\d+)?/);ok=!!m&&Math.abs(Number(m[0])-q.answer)<1e-9}else ok=norm(r.value)===norm(q.answer)}}
 else {let v=parseFloat(norm(document.getElementById('a'+i).value));ok=Number.isFinite(v)&&Math.abs(v-Number(q.answer))<1e-9}
 f.className='feedback '+(ok?'ok':'bad'); f.textContent=ok?'✓ Правильно!':'Спробуй ще раз'; if(ok){solved.add(i);update()}
}
function update(){document.getElementById('score').textContent=`Виконано: ${solved.size} / ${questions.length}`;document.getElementById('fill').style.width=(solved.size/questions.length*100)+'%'}
render();
</script></body></html>
